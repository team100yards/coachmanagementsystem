<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f15"/>
      <stop offset="50%" stop-color="#142A1D"/>
      <stop offset="100%" stop-color="#0a1810"/>
    </linearGradient>

    <!-- Pitch Grass Stripe Gradient -->
    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b3826" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#162e20" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5A823"/>
      <stop offset="50%" stop-color="#F3C64D"/>
      <stop offset="100%" stop-color="#C7921F"/>
    </linearGradient>

    <!-- Slide Vignette Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#234731" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#0d1f15" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#07120b" stop-opacity="0.98"/>
    </radialGradient>
  </defs>

  <!-- Base Dark Turf Canvas -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Field Mown Grass Stripes (10 Vertical Bands) -->
  <g>
    <rect x="0"    y="0" width="192" height="960" fill="url(#stripeGrad)"/>
    <rect x="384"  y="0" width="192" height="960" fill="url(#stripeGrad)"/>
    <rect x="768"  y="0" width="192" height="960" fill="url(#stripeGrad)"/>
    <rect x="1152" y="0" width="192" height="960" fill="url(#stripeGrad)"/>
    <rect x="1536" y="0" width="192" height="960" fill="url(#stripeGrad)"/>
  </g>

  <!-- Subtle Pitch Field Markings (Soccer / Athletic Field Overlay) -->
  <g fill="none" stroke="#F5F1E6" stroke-width="3" opacity="0.18">
    <!-- Outer boundary -->
    <rect x="100" y="80" width="1720" height="820" rx="4"/>
    
    <!-- Half-field line -->
    <line x1="960" y1="80" x2="960" y2="900"/>
    
    <!-- Center circle and spot -->
    <circle cx="960" cy="490" r="140"/>
    <circle cx="960" cy="490" r="6" fill="#F5F1E6"/>

    <!-- Left Penalty Area -->
    <rect x="100" y="270" width="280" height="440"/>
    <rect x="100" y="370" width="100" height="240"/>
    <circle cx="310" cy="490" r="6" fill="#F5F1E6"/>
    <path d="M380,380 A140,140 0 0 1 380,600"/>

    <!-- Right Penalty Area -->
    <rect x="1540" y="270" width="280" height="440"/>
    <rect x="1720" y="370" width="100" height="240"/>
    <circle cx="1610" cy="490" r="6" fill="#F5F1E6"/>
    <path d="M1540,380 A140,140 0 0 0 1540,600"/>

    <!-- Corner Arcs -->
    <path d="M100,116 A36,36 0 0 0 136,80"/>
    <path d="M1784,80 A36,36 0 0 0 1820,116"/>
    <path d="M1820,864 A36,36 0 0 0 1784,900"/>
    <path d="M136,900 A36,36 0 0 0 100,864"/>
  </g>

  <!-- Presentation Lighting Vignette -->
  <rect width="1920" height="1080" fill="url(#centerGlow)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1920" height="5" fill="url(#goldGrad)"/>

  <!-- Yard Marker Track Bar at the Bottom -->
  <g transform="translate(0, 960)">
    <!-- Bottom banner background -->
    <rect x="0" y="0" width="1920" height="120" fill="#0C1B12" opacity="0.95"/>
    <line x1="0" y1="0" x2="1920" y2="0" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- Hash Marks & Yard Numbers (10 to 100) -->
    <!-- Segment 1: 10 -->
    <g transform="translate(96, 0)">
      <line x1="0" y1="0" x2="0" y2="36" stroke="#F5F1E6" stroke-width="2.5" opacity="0.8"/>
      <line x1="43" y1="0" x2="43" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <line x1="86" y1="0" x2="86" y2="24" stroke="#F5F1E6" stroke-width="1.5" opacity="0.6"/>
      <line x1="129" y1="0" x2="129" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <text x="12" y="68" fill="#E5A823" font-family="'Oswald', 'Anton', 'Arial Black', sans-serif" font-size="28" font-weight="700" letter-spacing="2">10</text>
      <text x="12" y="94" fill="#F5F1E6" font-family="sans-serif" font-size="12" opacity="0.6" letter-spacing="1">YDS</text>
    </g>

    <!-- Segment 2: 20 -->
    <g transform="translate(268, 0)">
      <line x1="0" y1="0" x2="0" y2="36" stroke="#F5F1E6" stroke-width="2.5" opacity="0.8"/>
      <line x1="43" y1="0" x2="43" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <line x1="86" y1="0" x2="86" y2="24" stroke="#F5F1E6" stroke-width="1.5" opacity="0.6"/>
      <line x1="129" y1="0" x2="129" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <text x="12" y="68" fill="#E5A823" font-family="'Oswald', 'Anton', 'Arial Black', sans-serif" font-size="28" font-weight="700" letter-spacing="2">20</text>
      <text x="12" y="94" fill="#F5F1E6" font-family="sans-serif" font-size="12" opacity="0.6" letter-spacing="1">YDS</text>
    </g>

    <!-- Segment 3: 30 -->
    <g transform="translate(441, 0)">
      <line x1="0" y1="0" x2="0" y2="36" stroke="#F5F1E6" stroke-width="2.5" opacity="0.8"/>
      <line x1="43" y1="0" x2="43" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <line x1="86" y1="0" x2="86" y2="24" stroke="#F5F1E6" stroke-width="1.5" opacity="0.6"/>
      <line x1="129" y1="0" x2="129" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <text x="12" y="68" fill="#E5A823" font-family="'Oswald', 'Anton', 'Arial Black', sans-serif" font-size="28" font-weight="700" letter-spacing="2">30</text>
      <text x="12" y="94" fill="#F5F1E6" font-family="sans-serif" font-size="12" opacity="0.6" letter-spacing="1">YDS</text>
    </g>

    <!-- Segment 4: 40 -->
    <g transform="translate(614, 0)">
      <line x1="0" y1="0" x2="0" y2="36" stroke="#F5F1E6" stroke-width="2.5" opacity="0.8"/>
      <line x1="43" y1="0" x2="43" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <line x1="86" y1="0" x2="86" y2="24" stroke="#F5F1E6" stroke-width="1.5" opacity="0.6"/>
      <line x1="129" y1="0" x2="129" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <text x="12" y="68" fill="#E5A823" font-family="'Oswald', 'Anton', 'Arial Black', sans-serif" font-size="28" font-weight="700" letter-spacing="2">40</text>
      <text x="12" y="94" fill="#F5F1E6" font-family="sans-serif" font-size="12" opacity="0.6" letter-spacing="1">YDS</text>
    </g>

    <!-- Segment 5: 50 (Midfield highlight) -->
    <g transform="translate(787, 0)">
      <line x1="0" y1="0" x2="0" y2="44" stroke="#F3C64D" stroke-width="3.5" opacity="1"/>
      <line x1="43" y1="0" x2="43" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <line x1="86" y1="0" x2="86" y2="24" stroke="#F5F1E6" stroke-width="1.5" opacity="0.6"/>
      <line x1="129" y1="0" x2="129" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <text x="12" y="68" fill="#F3C64D" font-family="'Oswald', 'Anton', 'Arial Black', sans-serif" font-size="30" font-weight="700" letter-spacing="2">50</text>
      <text x="12" y="94" fill="#F3C64D" font-family="sans-serif" font-size="12" opacity="0.85" letter-spacing="1">MID</text>
    </g>

    <!-- Segment 6: 60 -->
    <g transform="translate(960, 0)">
      <line x1="0" y1="0" x2="0" y2="36" stroke="#F5F1E6" stroke-width="2.5" opacity="0.8"/>
      <line x1="43" y1="0" x2="43" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <line x1="86" y1="0" x2="86" y2="24" stroke="#F5F1E6" stroke-width="1.5" opacity="0.6"/>
      <line x1="129" y1="0" x2="129" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <text x="12" y="68" fill="#E5A823" font-family="'Oswald', 'Anton', 'Arial Black', sans-serif" font-size="28" font-weight="700" letter-spacing="2">60</text>
      <text x="12" y="94" fill="#F5F1E6" font-family="sans-serif" font-size="12" opacity="0.6" letter-spacing="1">YDS</text>
    </g>

    <!-- Segment 7: 70 -->
    <g transform="translate(1133, 0)">
      <line x1="0" y1="0" x2="0" y2="36" stroke="#F5F1E6" stroke-width="2.5" opacity="0.8"/>
      <line x1="43" y1="0" x2="43" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <line x1="86" y1="0" x2="86" y2="24" stroke="#F5F1E6" stroke-width="1.5" opacity="0.6"/>
      <line x1="129" y1="0" x2="129" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <text x="12" y="68" fill="#E5A823" font-family="'Oswald', 'Anton', 'Arial Black', sans-serif" font-size="28" font-weight="700" letter-spacing="2">70</text>
      <text x="12" y="94" fill="#F5F1E6" font-family="sans-serif" font-size="12" opacity="0.6" letter-spacing="1">YDS</text>
    </g>

    <!-- Segment 8: 80 -->
    <g transform="translate(1306, 0)">
      <line x1="0" y1="0" x2="0" y2="36" stroke="#F5F1E6" stroke-width="2.5" opacity="0.8"/>
      <line x1="43" y1="0" x2="43" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <line x1="86" y1="0" x2="86" y2="24" stroke="#F5F1E6" stroke-width="1.5" opacity="0.6"/>
      <line x1="129" y1="0" x2="129" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <text x="12" y="68" fill="#E5A823" font-family="'Oswald', 'Anton', 'Arial Black', sans-serif" font-size="28" font-weight="700" letter-spacing="2">80</text>
      <text x="12" y="94" fill="#F5F1E6" font-family="sans-serif" font-size="12" opacity="0.6" letter-spacing="1">YDS</text>
    </g>

    <!-- Segment 9: 90 -->
    <g transform="translate(1479, 0)">
      <line x1="0" y1="0" x2="0" y2="36" stroke="#F5F1E6" stroke-width="2.5" opacity="0.8"/>
      <line x1="43" y1="0" x2="43" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <line x1="86" y1="0" x2="86" y2="24" stroke="#F5F1E6" stroke-width="1.5" opacity="0.6"/>
      <line x1="129" y1="0" x2="129" y2="16" stroke="#F5F1E6" stroke-width="1.5" opacity="0.4"/>
      <text x="12" y="68" fill="#E5A823" font-family="'Oswald', 'Anton', 'Arial Black', sans-serif" font-size="28" font-weight="700" letter-spacing="2">90</text>
      <text x="12" y="94" fill="#F5F1E6" font-family="sans-serif" font-size="12" opacity="0.6" letter-spacing="1">YDS</text>
    </g>

    <!-- Segment 10: 100 Goal Line -->
    <g transform="translate(1652, 0)">
      <line x1="0" y1="0" x2="0" y2="44" stroke="#E5A823" stroke-width="3" opacity="0.9"/>
      <line x1="172" y1="0" x2="172" y2="44" stroke="#E5A823" stroke-width="3" opacity="0.9"/>
      <text x="12" y="68" fill="#F3C64D" font-family="'Oswald', 'Anton', 'Arial Black', sans-serif" font-size="28" font-weight="700" letter-spacing="2">100</text>
      <text x="12" y="94" fill="#E5A823" font-family="sans-serif" font-size="12" opacity="0.85" letter-spacing="1">GOAL</text>
    </g>
  </g>
</svg>
