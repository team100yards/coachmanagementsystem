function useFootballForumRoster(collectionName) {
  const [rows, setRows] = useState([]);
  useEffect(() => {
    const unsub = db.collection(collectionName).onSnapshot((snap) => {
      const players = snap.docs.map((doc) => {
        const d = doc.data();
        return `${d.number || "-"}, ${d.name || ""}, ${d.position || "ST"}`;
      });
      setRows(players.join("\n"));
    });
    return () => unsub();
  }, [collectionName]);

}

function assignToFormation(players, slots) {
  const pool = [...players];
  const filled = slots.map((slot) => {
    let idx = pool.findIndex((p) => p.canonical === slot.code);
    if (idx === -1) {
      const group = GROUP[slot.code] || "MID";
      const side = SIDE[slot.code] || "C";
      idx = pool.findIndex((p) => p.group === group && p.side === side);
    }
    if (idx === -1) {
      const group = GROUP[slot.code] || "MID";
      idx = pool.findIndex((p) => p.group === group);
    }
    if (idx === -1) return { slot, player: null };
    const [player] = pool.splice(idx, 1);
    return { slot, player };
  });
  const order = { GK: 0, DEF: 1, MID: 2, FWD: 3 };
  pool.sort((a, b) => (order[a.group] - order[b.group]) || a.name.localeCompare(b.name));
  return { filled, subs: pool };
}

  const [showShareModal, setShowShareModal] = useState(false);
  const [modalCopied, setModalCopied] = useState(false);

  // ---------- Exact Match XI slot data (the source of truth for pitch placement) ----------
  // exactStarters[i] lines up 1:1 with FORMATIONS[syncedFormationKey][i] — this is what
  // guarantees the pitch always matches Match XI exactly, with no re-calculation/mismatch.
  const [exactStarters, setExactStarters] = useState(null);
  const [exactSubs, setExactSubs] = useState(null);
  const [outOfSquad, setOutOfSquad] = useState([]);
  const [syncedFormationKey, setSyncedFormationKey] = useState(null);
  const [isDirty, setIsDirty] = useState(false); // true once the roster is hand-edited

  const reportHeight = () => {
    try {
      if (window.parent && window.parent !== window) {
        const h = document.documentElement.scrollHeight;
        window.parent.postMessage({ type: "ff-height", height: h }, "*");
      }
    } catch (e) {}
  };

  // Builds a pitch layout (x/y per slot) for ANY formation given just its role/count
  // definition (e.g. [{r:'GK',n:1},{r:'DEF',n:4},{r:'MID',n:4},{r:'FWD',n:2}]) — this is
  // what lets custom formations from Match XI render here even though they're not one of
  // the 6 built-in shapes.
  const autoLayoutFormation = (def) => {
    const roleCode = { GK: "GK", DEF: "CB", MID: "CM", FWD: "ST" };
    const lines = (def || []).filter((l) => l && l.n > 0);
    const outfield = lines.length - 1;
    const slots = [];
    lines.forEach((line, li) => {
      let y;
      if (li === 0) y = 93;
      else if (outfield <= 1) y = 45;
      else y = 76 - (li - 1) * (64 / (outfield - 1));
      const n = line.n;
      for (let i = 0; i < n; i++) {
        const x = 8 + (84 / (n + 1)) * (i + 1);
        const code = roleCode[line.r] || "CM";
        slots.push({ code, label: line.lbl || code, x, y });
      }
    });
    return slots;
  };

  // ---------- Sync roster from the Football Forum parent app (Match XI: playing 11 + subs + management) ----------
  const applySyncPayload = (data) => {
    if (!data) return;
    if (typeof data.isCoach === "boolean") setIsCoach(data.isCoach);
    if (data.formation && !FORMATIONS[data.formation] && data.formationDef) {
      FORMATIONS[data.formation] = autoLayoutFormation(data.formationDef);
    }
    if (data.customPos && typeof data.customPos === "object") {
      setCustomPos(data.customPos);
    }
    if (data.ballPos && typeof data.ballPos === "object" && data.ballPos.x != null) {
      setBallPos(data.ballPos);
    }
    if (data.formation && FORMATIONS[data.formation]) {
      setFormationKey(data.formation);
    }
    if (typeof data.showZones === "boolean") setShowZones(data.showZones);
    if (typeof data.showThirds === "boolean") setShowThirds(data.showThirds);
    if (typeof data.unitCoverShift === "boolean") setUnitCoverShift(data.unitCoverShift);
    if (typeof data.showCoverLines === "boolean") setShowCoverLines(data.showCoverLines);
    if (Array.isArray(data.activeLines)) setActiveLines(data.activeLines);
    if (data.starters) {
      // Exact per-slot data from a saved Match XI squad — preserves placement exactly.
      setExactStarters(data.starters);
      setExactSubs(data.subs || []);
      setOutOfSquad(Array.isArray(data.outOfSquad) ? data.outOfSquad : []);
      setSyncedFormationKey(data.formation && FORMATIONS[data.formation] ? data.formation : null);
      const startRows = [];
      data.starters.forEach((p) => { if (p) startRows.push({ ...p, type: "start" }); });
      const subRows = (data.subs || []).map((p) => ({ ...p, type: "sub" }));
      const flat = [...startRows, ...subRows];
      setManualPlayers(flat.map((p) => ({
        id: p.id || `sync-${Math.random().toString(36).slice(2, 8)}`,
        name: p.name || "",
        number: p.number != null && p.number !== "" ? String(p.number) : "-",
        position: p.position || "ST",
        type: p.type,
      })));
    } else {
      // No saved Match XI squad — fell back to the full player database (flat list only).
      // Split it the same way the pitch would: first N (formation size) as Playing XI, rest as Substitutes.
      setExactStarters(null);
      setExactSubs(null);
      setOutOfSquad([]);
      setSyncedFormationKey(null);
      const startCount = (FORMATIONS[data.formation || formationKey] || FORMATIONS["4-3-3"]).length;

        if (m.idx === dragSlotIndex) {

            x: Math.round(Math.max(4, Math.min(96, targetX)) * 10) / 10,
            y: Math.round(Math.max(4, Math.min(96, targetY)) * 10) / 10,
          };
          return;
        }

        const dist = Math.abs(r - dragRank);
        let shiftX = deltaX * 0.78;

        // In attacking third, wingers make diagonal inside runs to overload box
        if (tAttack > 0.35) {
          if (m.code === "LW" && deltaX > 0) shiftX += 3.0;
          if (m.code === "RW" && deltaX < 0) shiftX -= 3.0;
        }

        let nextX = m.slot.x + shiftX;

        // Vertical shift:
        // Attacking third: box penetration & cutback options
        // Middle third: mid screening & trap
        // Defensive third: counter-attack outlet
        const fwdLineShiftY = deltaY * 0.82;
        let shadowDepth = 0;
        if (deltaY < 0 && dist === 1) {
          shadowDepth = Math.min(3.5, Math.abs(deltaY) * 0.22);
        }

        let nextY = m.slot.y + fwdLineShiftY + shadowDepth;

        nextX = Math.max(4, Math.min(96, nextX));
        nextY = Math.max(4, Math.min(96, nextY));

        nextCustom[`${currentFormationKey}::${m.idx}`] = {
          x: Math.round(nextX * 10) / 10,
          y: Math.round(nextY * 10) / 10,
        };
      });
    }

    return nextCustom;
  };

  const tacticalUnitVisuals = useMemo(() => {
    if (!showCoverLines && !unitCoverShift) return [];

    const units = ["DEF", "MID", "FWD"];
    const results = [];

    units.forEach((g) => {
      if (!activeLines.includes(g)) return;

      const members = filled
        .map((item, idx) => {
          const code = item.player ? item.player.canonical : item.slot.code;
          const group = GROUP[code] || "MID";
          return {
            idx,
            slot: item.slot,
            player: item.player,
            code,
            group,
            pos: getPos(item.slot, idx),
          };
        })
        .filter((m) => m.group === g);

      if (members.length === 0) return;

      members.sort((a, b) => a.slot.x - b.slot.x);

      // Find if any member is displaced from base slot
      let leadMember = null;
      let maxDisplacement = 0;

      members.forEach((m) => {
        const dx = m.pos.x - m.slot.x;
        const dy = m.pos.y - m.slot.y;
        const disp = Math.sqrt(dx * dx + dy * dy);
        if (disp > maxDisplacement && disp > 1.5) {
          maxDisplacement = disp;
          leadMember = m;
        }
      });

      // If active drag is in this group, that player is the lead
      if (activeDragSlot != null) {
        const activeM = members.find((m) => m.idx === activeDragSlot);
        if (activeM) leadMember = activeM;
      }

      // Polyline points for chain
      const points = members.map((m) => `${m.pos.x},${m.pos.y}`).join(" ");

      // Cover / support vectors from lead member to teammates
      const coverVectors = [];
      if (leadMember && members.length > 1) {
        const leadRank = members.findIndex((m) => m.idx === leadMember.idx);
        const leadY = leadMember.pos.y;
        const inAttackingThird = leadY < 33.33;
        const inDefensiveThird = leadY > 66.67;

        members.forEach((m, r) => {
          if (m.idx === leadMember.idx) return;
          const dist = Math.abs(r - leadRank);
          let label = "🛡️ Cover";

          if (g === "DEF") {
            if (inAttackingThird) {
              label = dist === 1 ? "⚔️ High Line" : "🔒 Rest-Def";
            } else if (inDefensiveThird) {
              label = dist === 1 ? "🧱 Box Protect" : (r === 0 || r === members.length - 1 ? "🔒 Far Post" : "🛡️ Near Post");
            } else {
              if (dist === 1) {
                label = "🛡️ Cover";
              } else if (r === 0 || r === members.length - 1) {
                label = "🔒 Pinch";
              } else {
                label = "🧹 Sweep";
              }
            }
          } else if (g === "MID") {
            if (m.code === "CDM") {
              if (inAttackingThird) label = "🛡️ Rest-Def Anchor";
              else if (inDefensiveThird) label = "🛡️ Zone 14 Shield";
              else label = "🛡️ Pivot Screen";
            } else if (m.code === "CAM" || m.code === "LAM" || m.code === "RAM") {
              if (inAttackingThird) label = "🎯 Overload";
              else if (inDefensiveThird) label = "🧱 Low Block Wall";
              else label = "📐 Pocket Link";
            } else if (m.code === "LM" || m.code === "RM" || m.code === "LW" || m.code === "RW") {
              if (inAttackingThird) label = "↗️ Width / Cutback";
              else if (inDefensiveThird) label = "🔒 Flank Track";
              else label = "📐 Flank Triangle";
            } else {
              // Central Midfielder (CM)
              if (inAttackingThird) label = dist === 1 ? "⚡ Counter-Press" : "📐 Cutback Option";
              else if (inDefensiveThird) label = "🧱 Low Block Screen";
              else label = dist === 1 ? "📐 Passing Triangle" : "🔄 Pivot Support";
            }
          } else if (g === "FWD") {
            if (inAttackingThird) {
              label = dist === 1 ? "🎯 Box Attack" : "↗️ Diagonal Run";
            } else if (inDefensiveThird) {
              label = "🏃 Break Outlet";
            } else {
              label = "🔄 Shadow Press";
            }
          }

          coverVectors.push({
            from: leadMember.pos,
            to: m.pos,
            targetCode: m.code,
            targetIdx: m.idx,
            label,
            isPrimary: dist === 1,
            color: CODE_COLORS[m.code] || ZONE_COLORS[g],
          });
        });
      }

      // Compactness shading polygon
      let polygonPoints = "";
      if (members.length >= 3) {
        const topPts = members.map((m) => `${m.pos.x},${Math.max(2, m.pos.y - 3.5)}`);
        const btmPts = [...members].reverse().map((m) => `${m.pos.x},${Math.min(98, m.pos.y + 3.5)}`);
        polygonPoints = [...topPts, ...btmPts].join(" ");
      }

      results.push({
        group: g,
        color: ZONE_COLORS[g],
        points,
        members,
        leadMember,
        coverVectors,
        polygonPoints,
      });
    });

    return results;
  }, [filled, customPos, formationKey, activeLines, showCoverLines, unitCoverShift, activeDragSlot]);

  const activeTacticalPhase = useMemo(() => {

      window.removeEventListener("pointerup", handleUp);

                    const isCoachMsg = m.senderRole === 'coach';
                    const roleLabel = (m.senderRole || 'member').toUpperCase();
                    const timeStr = formatTime(m.createdAt);
                    let avatar = '💬';
                    if (isCoachMsg) avatar = '👑';
                    else if (m.senderRole === 'player') avatar = '⚽';
                    else if (m.senderRole === 'staff') avatar = '🧑‍💼';

                    return (
                      <div key={m.id} className={`flex gap-2.5 items-start ${isMine ? 'flex-row-reverse self-end' : 'self-start'}`} style={{ maxWidth: "88%" }}>
                        <div className="flex items-center justify-center rounded-full flex-shrink-0" style={{ width: 28, height: 28, background: "rgba(244,241,232,0.1)", border: `1px solid ${C.border}`, fontSize: 12 }}>
                          {avatar}
                        </div>
                        <div className="flex flex-col gap-0.5" style={{ alignItems: isMine ? "flex-end" : "flex-start" }}>
                          <div className="flex items-center gap-1.5" style={{ fontSize: 10, color: C.sage }}>
                            <span style={{ fontWeight: 700, color: C.cream }}>{m.senderName}</span>
                            <span className="mono rounded px-1" style={{ fontSize: 8.5, background: isCoachMsg ? "rgba(232,179,76,0.2)" : "rgba(244,241,232,0.1)", color: isCoachMsg ? C.amber : C.sage }}>{roleLabel}</span>
                          </div>
                          <div className="rounded-xl px-3 py-2 relative group" style={{
                            background: isMine ? "#1A5C1A" : "rgba(30,77,43,0.6)",
                            border: `1px solid ${isMine ? "#237A23" : C.border}`,
                            color: C.cream,
                            fontSize: 13,
                            lineHeight: 1.35,
                            wordBreak: "break-word",
                            borderTopLeftRadius: !isMine ? 2 : 12,
                            borderTopRightRadius: isMine ? 2 : 12,
                          }}>
                            {isCoach && (
                              <div className="hidden group-hover:flex absolute -top-3 right-1 gap-1 px-1.5 py-0.5 rounded" style={{ background: C.panel, border: `1px solid ${C.border}`, fontSize: 10 }}>
                                <button onClick={() => togglePinMessage(m.id, !!m.pinned)} style={{ color: C.amber, background: "none", border: "none", cursor: "pointer", fontSize: 10 }}>{m.pinned ? '📌 Unpin' : '📌 Pin'}</button>
                                <button onClick={() => deleteChatMessage(m.id)} style={{ color: "#E88A6D", background: "none", border: "none", cursor: "pointer", fontSize: 10 }}>🗑️</button>
                              </div>
                            )}
                            <div>{m.text}</div>
                            <div style={{ fontSize: 9, opacity: 0.6, marginTop: 3, textAlign: "right" }}>{timeStr} {m.pinned ? '📌' : ''}</div>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
                <div ref={chatMessagesEndRef} />
              </div>

              {/* Message Input Row */}
              <form onSubmit={sendChatMessage} className="flex gap-2 p-3 border-t flex-shrink-0" style={{ borderColor: C.border, background: "rgba(19,43,28,0.95)" }}>
                <input
                  type="text"
                  placeholder={isCoach ? "Post a message as Coach…" : "Type a message to chat with the team…"}
                  value={chatInputText}
                  onChange={(e) => setChatInputText(e.target.value)}
                  className="flex-1 px-3.5 py-2 rounded-full text-sm outline-none"
                  style={{ background: C.bg, border: `1px solid ${C.border}`, color: C.cream }}
                />
                <button
                  type="submit"
                  className="w-9 h-9 rounded-full flex items-center justify-center text-white flex-shrink-0 cursor-pointer hover:scale-105 transition-transform"
                  style={{ background: "#1A5C1A", border: "none", boxShadow: "0 2px 8px rgba(0,0,0,0.3)" }}
                  title="Send"
                >
                  ➤
                </button>
              </form>
            </div>
          )}

          {/* Minimized Pill Button */}
          <button
            onClick={toggleChatVisibility}
            className="oswald flex items-center gap-2 cursor-pointer transition-all hover:scale-105 shadow-xl"
            style={{
              padding: "10px 18px",
              background: C.panel,
              border: `1.5px solid ${C.amber}`,
              borderRadius: 30,
              color: C.cream,
              fontSize: 13,
              letterSpacing: "0.05em",
              fontWeight: 700,
              pointerEvents: "all",
              boxShadow: "0 8px 24px rgba(0,0,0,0.4)"
            }}
            title="Click to open Team Chat"
          >
            <span>💬 Team Chat</span>
            <span
              className="mono rounded-full px-2 py-0.5"
              style={{ background: C.amber, color: C.ink, fontSize: 11, fontWeight: 700 }}
            >
              {chatMsgs.length}
            </span>
          </button>
        </div>
        )}

        {/* GAME CHANGERS + MANAGEMENT SECTION (Below the Pitch & Chat stage) */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
          {/* Substitutes */}
          <div>
            <div className="oswald" style={{ fontSize: 12, letterSpacing: "0.3em", color: C.sage, marginBottom: 8 }}>
              GAME CHANGERS · {subs.length}
            </div>
            {subs.length === 0 ? (
              <div style={{ fontSize: 14, color: "rgba(143,191,159,0.7)", fontStyle: "italic", background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: "12px 16px" }}>No players left on the bench.</div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                {subs.map((p) => (
                  <div
                    key={p.id}
                    className="flex items-center gap-3"
                    style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 12px" }}
                  >
                    <div className="mono font-bold text-center" style={{ color: C.amber, fontSize: 14, width: 24 }}>{p.number}</div>
                    <div style={{ minWidth: 0 }}>
                      <div className="truncate" style={{ color: C.cream, fontSize: 13 }}>{p.name}</div>
                      <div style={{ fontSize: 10, color: C.sage, letterSpacing: "0.02em" }}>{p.rawPosition}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Management / Staff */}
          <div>
            <div className="oswald" style={{ fontSize: 12, letterSpacing: "0.3em", color: C.sage, marginBottom: 8 }}>
              MANAGEMENT / STAFF · {managementFilled.length}
            </div>
            {managementFilled.length === 0 ? (
              <div style={{ fontSize: 14, color: "rgba(143,191,159,0.7)", fontStyle: "italic", background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: "12px 16px" }}>No management staff assigned.</div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                {managementFilled.map((m) => (
                  <div
                    key={m.id}
                    className="flex items-center gap-3"
                    style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 12px" }}
                  >
                    <div
                      className="flex items-center justify-center"
                      style={{ width: 26, height: 26, borderRadius: "50%", background: "rgba(139,95,191,0.25)", border: `1px solid ${ZONE_COLORS.GK}`, flexShrink: 0 }}
                    >
                      <span style={{ fontSize: 12 }}>👔</span>
                    </div>
                    <div style={{ minWidth: 0 }}>
                      <div className="truncate" style={{ color: C.cream, fontSize: 13 }}>{m.name}</div>
                      <div style={{ fontSize: 10, color: C.sage, letterSpacing: "0.02em" }}>{m.role}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        {/* OUT OF SQUAD SECTION */}
        {outOfSquad && outOfSquad.length > 0 && (
          <div style={{ marginTop: 24 }}>
            <div className="oswald" style={{ fontSize: 12, letterSpacing: "0.3em", color: C.sage, marginBottom: 8 }}>
              OUT OF SQUAD · {outOfSquad.length}
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
              {outOfSquad.map((p) => (
                <div
                  key={p.id}
                  className="flex items-center gap-3"
                  style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 12px", opacity: 0.75 }}
                >
                  <div className="mono font-bold text-center" style={{ color: "rgba(143,191,159,0.5)", fontSize: 14, width: 24 }}>{p.number}</div>
                  <div style={{ minWidth: 0 }}>
                    <div className="truncate" style={{ color: C.cream, fontSize: 13 }}>{p.name}</div>
                    <div style={{ fontSize: 10, color: C.sage, letterSpacing: "0.02em" }}>{p.position || "—"} · Out of squad</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* TEAM VIEW SHARE POPUP MODAL */}
        {showShareModal && (
          <div
            className="no-print"
            style={{
              position: "fixed",
              inset: 0,
              background: "rgba(0,0,0,0.65)",
              zIndex: 10000,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              padding: 20
            }}
            onClick={() => setShowShareModal(false)}
          >
            <div
              style={{
                width: 440,
                maxWidth: "100%",
                background: C.panel,
                border: `1.5px solid ${C.border}`,
                borderRadius: 18,
                padding: 24,
                boxShadow: "0 16px 48px rgba(0,0,0,0.6)"
              }}
              onClick={(e) => e.stopPropagation()}
            >
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                <div>
                  <h3 className="oswald" style={{ fontSize: 18, margin: 0, color: C.cream, fontWeight: 700, letterSpacing: "0.05em" }}>
                    👁️ SHARE TEAM VIEW LINK
                  </h3>
                  <p style={{ fontSize: 12, color: C.sage, margin: "3px 0 0" }}>
                    Read-only view link for players &amp; parents (no login needed)
                  </p>
                </div>
                <button
                  style={{ fontSize: 18, background: "none", border: "none", color: C.sage, cursor: "pointer", fontWeight: 700, padding: 4 }}
                  onClick={() => setShowShareModal(false)}
                >
                  ✕
                </button>
              </div>

              {/* Link Input Box */}
              <div style={{ display: "flex", alignItems: "center", background: "rgba(19,43,28,0.9)", border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 14px", marginTop: 12 }}>
                <input
                  type="text"
                  readOnly
                  value={getTeamViewLink()}
                  style={{ width: "100%", background: "none", border: "none", color: C.cream, fontSize: 12.5, outline: "none", fontFamily: "inherit" }}
                />
              </div>

              {/* 3 Horizontal Uniform Share Options */}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginTop: 16 }}>
                <button
                  type="button"
                  onClick={copyShareModalLink}
                  className="oswald"
                  style={{
                    height: 42,
                    padding: "0 12px",
                    background: "rgba(244,241,232,0.06)",
                    border: `1px solid ${C.border}`,
                    borderRadius: 10,
                    display: "inline-flex",
                    alignItems: "center",
                    justifyContent: "center",
                    gap: 7,
                    color: C.cream,
                    fontSize: 13,
                    fontWeight: 600,
                    cursor: "pointer"
                  }}
                >
                  <span style={{ fontSize: 16 }}>📋</span>
                  <span>{modalCopied ? "Copied!" : "Copy Link"}</span>
                </button>
                <button
                  type="button"
                  onClick={shareEmail}
                  className="oswald"
                  style={{
                    height: 42,
                    padding: "0 12px",
                    background: "rgba(244,241,232,0.06)",
                    border: `1px solid ${C.border}`,
                    borderRadius: 10,
                    display: "inline-flex",
                    alignItems: "center",
                    justifyContent: "center",
                    gap: 7,
                    color: C.cream,
                    fontSize: 13,
                    fontWeight: 600,
                    cursor: "pointer"
                  }}
                >
                  <span style={{ fontSize: 16 }}>✉️</span>
                  <span>Email</span>
                </button>
                <button
                  type="button"
                  onClick={shareSMS}
                  className="oswald"
                  style={{
                    height: 42,
                    padding: "0 12px",
                    background: "rgba(244,241,232,0.06)",
                    border: `1px solid ${C.border}`,
                    borderRadius: 10,
                    display: "inline-flex",
                    alignItems: "center",
                    justifyContent: "center",
                    gap: 7,
                    color: C.cream,
                    fontSize: 13,
                    fontWeight: 600,
                    cursor: "pointer"
                  }}
                >
                  <span style={{ fontSize: 16 }}>💬</span>
                  <span>SMS</span>
                </button>
              </div>

              <div style={{ marginTop: 16, display: "flex", justifyContent: "flex-end" }}>
                <button
                  className="oswald"
                  style={{ padding: "7px 18px", borderRadius: 8, background: "rgba(244,241,232,0.1)", border: `1px solid ${C.border}`, color: C.cream, fontSize: 12, cursor: "pointer" }}
                  onClick={() => setShowShareModal(false)}
                >
                  Close
                </button>
              </div>
            </div>
          </div>
        )}

        {/* FOOTER COPYRIGHT */}
        <div className="text-center py-6 mt-8 no-print border-t" style={{ borderColor: C.border, color: C.sage, fontSize: 12 }}>
          <div>&copy; 2026 <strong style={{ color: C.cream, fontWeight: 700 }}>100 Yards</strong>. All rights reserved.</div>
          <div style={{ fontSize: 11, marginTop: 2, opacity: 0.8 }}>Tactical Visualizer &amp; Squad Studio</div>
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FormationBuilder />);
</script>
<script src="cms-nav.js"></script>
</body>
</html>
